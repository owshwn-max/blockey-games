 const d=(a,b,w,h,dx,dy,fl)=>{if(fl){x.save();x.translate(dx+w,dy);x.scale(-1,1);x.drawImage(S,a*k,b*k,w*k,h*k,0,0,w,h);x.restore()}else x.drawImage(S,a*k,b*k,w*k,h*k,dx,dy,w,h)};
 d(4,20,4,12,4,20);d(old?4:20,old?20:52,4,12,8,20,old);d(20,20,8,12,4,8);d(44,20,aw,12,slim?1:0,8);d(old?44:36,old?20:52,aw,12,12,8,old);
 if(!old){d(4,36,4,12,4,20);d(4,52,4,12,8,20);d(20,36,8,12,4,8);d(44,36,aw,12,slim?1:0,8);d(52,52,aw,12,12,8)}
 d(8,8,8,8,4,0);d(40,8,8,8,4,0);
 const h=document.createElement('canvas');h.width=8;h.height=8;const hx=h.getContext('2d');hx.imageSmoothingEnabled=false;hx.drawImage(S,8*k,8*k,8*k,8*k,0,0,8,8);hx.drawImage(S,40*k,8*k,8*k,8*k,0,0,8,8);
 return{b:c.toDataURL('image/png'),h:h.toDataURL('image/png')}}
const okSkin=im=>im.width>=64&&(im.height===im.width||im.height*2===im.width);
async function blobImg(u,chk){const r=await fetch(u);if(!r.ok)throw 0;if(chk&&!chk(r))throw 0;const url=URL.createObjectURL(await r.blob());try{return await loadImg(url)}finally{setTimeout(()=>URL.revokeObjectURL(url),5000)}}
async function fetchSkin(name){const n=encodeURIComponent(name);let id='',ex=null,tex='';
 try{const r=await fetch('https://playerdb.co/api/player/minecraft/'+n),j=await r.json();ex=!!(j&&j.success);if(ex){const p=j.data.player;id=String(p.raw_id||p.id||'').replace(/-/g,'');tex=String(p.skin_texture||'').replace(/^http:/,'https:')}}catch(e){}
 if(ex===false)return{x:1};
 if(ex===null)return null;
 /* 1) the real skin straight from Mojang's texture server (cannot be a default skin) */
 if(tex){try{const im=await blobImg(tex);if(okSkin(im))return skinFig(im)}catch(e){}}
 /* 2) crafatar, only if it says it has the real skin (a 404 or "local" means it sent a default skin) */
 if(id){try{const im=await blobImg('https://crafatar.com/skins/'+id,r=>{const t=r.headers.get('x-storage-type');return t!=='local'});if(okSkin(im))return skinFig(im)}catch(e){}}
 /* 3) no custom skin on the account: the default skin is the correct answer */
 if(!tex){for(const u of ['https://minotar.net/skin/'+n,'https://mc-heads.net/skin/'+n]){try{const im=await blobImg(u);if(okSkin(im))return skinFig(im)}catch(e){}}}
 return null}

 if(!names.length){AD.msg='Every player already has a saved skin.';return render()}
 SKRUN=true;let ok=0,miss=0;const fail=[];
 try{for(let i=0;i<names.length;i++){const st=$('#skst');if(st)st.textContent='Fetching '+(i+1)+' of '+names.length+': '+names[i];const r=await fetchSkin(names[i]);
  if(r&&r.b){DB.skins[names[i].toLowerCase()]=r;ok++}else if(r&&r.x){if(!(DB.skins[names[i].toLowerCase()]||{}).b)DB.skins[names[i].toLowerCase()]={x:1};miss++}else fail.push(names[i]);
  await new Promise(r=>setTimeout(r,150))}}finally{SKRUN=false}
 AD.msg='Saved '+ok+' skins. '+(miss?miss+' usernames do not exist (they get the gray silhouette). ':'')+(fail.length?'Could not download: '+fail.slice(0,8).join(', ')+(fail.length>8?' and '+(fail.length-8)+' more':'')+'. Try again later or upload their skin file below.':'');saveDB()}
async function upSkin(el){const f=el.files[0],n=($('#skn').value||'').trim();if(!f||!n){AD.msg='Type the player username first, then choose their skin PNG.';return render()}
 try{const url=await new Promise(r=>{const rd=new FileReader;rd.onload=()=>r(rd.result);rd.readAsDataURL(f)}),im=await loadImg(url);if(!(im.width>=64&&(im.height===im.width||im.height*2===im.width)))throw 0;DB.skins=DB.skins||{};DB.skins[n.toLowerCase()]=skinFig(im);AD.msg='Skin saved for '+n+'.'}catch(e){AD.msg='That is not a normal Minecraft skin PNG (64x64 or 64x32).'}saveDB()}

<div class="box"><h3 style="margin-top:0">Live sync</h3><p class="mu">Status: <b>${CL.url?(CL.admin?'connected as admin':'read-only'):'not connected'}</b> · <span id="clst">${esc(CL.msg)}</span></p>${CL.url?`<div class="row"><button class="pri" onclick="cloudPush(true);AD.msg='Uploading everything...';render()">Upload everything now</button><button onclick="cloudTest()">Test connection</button><button onclick="cloudFile()">Download cloud.json</button><button class="dg" onclick="ask('Disconnect live sync on this device?',cloudOff)">Disconnect</button></div><p class="mu">Upload <code>cloud.json</code> to GitHub next to index.html once. After that every visitor receives your Admin changes within a second or two, no more data.json uploads.</p>`:`<p class="mu">One-time setup (free): in the Firebase console create a project, then (1) Build, Realtime Database, Create database. (2) Rules tab: paste <code>{"rules":{".read":true,".write":"auth != null &amp;&amp; auth.token.email == 'YOUR-ADMIN-EMAIL'","ut":{"$u":{".write":true}},"inbox":{"$u":{".write":true}},"live":{"$m":{".write":true}}}}</code> and Publish. (3) Build, Authentication, Email/Password on, then Users, Add user with that email and a password. Turn off sign-ups in Authentication, Settings, User actions. (4) Project settings, General: copy the Web API Key. (5) Copy the database URL from the Realtime Database page. Then fill this in.</p>`}<div class="row"><input id="cu" placeholder="Database URL (https://...firebaseio.com)" value="${esc(cloudCfg().url||'')}"><input id="ck" placeholder="Web API key" value="${esc(cloudCfg().apiKey||'')}"></div><div class="row"><input id="ce" placeholder="Admin email" value="${esc(cloudCfg().email||'')}"><input id="cp" type="password" placeholder="Admin password"><button class="pri" onclick="cloudSave()">Connect</button></div></div>

<div class="box"><h3 style="margin-top:0">5. Stats</h3><p class="mu">Copy the whole stats table from the main page (headers included) and paste it here. Each player you have already imported is matched by username and updated. BHL overalls are mostly set by contract (4.5K lowest to 45K best), then stats separate players on similar contracts, with goals weighted a little heavier. Players on 4.5K (BHL minimum and all of NAMHL) are ranked against each other mainly by goals and assists, with goals counting a bit more; other stats only break ties. A player with clearly outstanding stats far above their contract gets a breakout boost. NAMHL and JBHL overalls use stats only. Skaters on 13K or more are always at least 79 overall. Players who are not imported yet are skipped.</p><textarea id="bulk" placeholder="name,g,a,sog,gp&#10;Steve12,4,6,20,10"></textarea><div class="row"><button onclick="bulkStats()">Import stats</button></div></div>
