 for(const [gn,pl] of [['F',fw],['D',df]]){const w=WF[gn],ks=Object.keys(w),st=pl.filter(p=>p.toi>0),big=st.filter(p=>p.toi>=15),ref=big.length>=3?big:st,ms={};
  ks.forEach(k=>{const v=ref.map(p=>rates(p)[k]),m=v.reduce((a,b)=>a+b,0)/(v.length||1),sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length||1))||1;ms[k]=[m,sd]});

function effW(k){const pool=P.filter(p=>p.league===k),w=[...CFG.PK[k].w];for(let t=3;t>0;t--)if(!pool.some(p=>p.tier===t)){w[t-1]+=w[t];w[t]=0}return w}

function openPack(k){const pk=CFG.PK[k],pool=P.filter(p=>p.league===k);if(!pool.length||S.bb<pk.cost)return;S.bb-=pk.cost;const w=effW(k),cards=[];
for(let i=0;i<pk.n;i++){let r=Math.random()*100,t=0;for(;t<3;t++){r-=w[t];if(r<0)break}let sub;while(t>=0&&!(sub=pool.filter(p=>p.tier===t)).length)t--;if(!sub||!sub.length)sub=pool;const p=sub[Math.floor(Math.random()*sub.length)];cards.push({p,dup:!!S.owned[p.name]});S.owned[p.name]=(S.owned[p.name]||0)+1}
cards.sort((a,b)=>a.p.rating-b.p.rating);save();render();anim={cards,k,i:0,fl:false,busy:false};const ov=$('#ov'),c=pk.c;ov.className='ov show';ov.style.cssText=`--pa:${c[0]};--pb:${c[1]};--glow:${c[0]}`;

const ZZ=(()=>{const e=[];for(let i=0;i<=24;i++)e.push((i*100/24).toFixed(1)+'% '+(i%2?17:14)+'%');return{t:'polygon(0 0,100% 0,'+[...e].reverse().join(',')+')',b:'polygon('+e.join(',')+',100% 100%,0 100%)'}})();

function parseRoster(txt,lg){return txt.split(/\r?\n/).map(l=>l.trim().replace(/^[-*•\d.)]+\s+/,'')).filter(Boolean).map(l=>{const t=l.split(/\s*[,\t|;]\s*|\s+/).filter(Boolean),d={name:t.shift(),pos:'W',contract:lg==='BHL'?CFG.CMIN:lg==='NAMHL'?CFG.CMIN:0};t.forEach(x=>{if(/^(c|w|d|g|lw|rw|center|winger|defense|goalie)$/i.test(x))d.pos=nPos(x);else if(/^\$?\d[\d,.]*k?$/i.test(x)&&lg==='BHL')d.contract=Math.min(CFG.CMAX,Math.max(CFG.CMIN,money(x)))});return d})}
function parseWeb(txt,lg){const out=[];let cur=null;txt.split(/\r?\n/).forEach(raw=>{const l=raw.trim();if(!l||/^#\d+$/.test(l))return;
if(l[0]==='$'){const m=l.match(/\$\s*([\d,.]+k?)/i);if(cur&&cur.c==null&&m)cur.c=money(m[1]);return}
const m=l.match(/^(\S+)\s+\$\s*([\d,.]+k?)/i);if(m){cur={name:m[1],c:money(m[2])};out.push(cur);return}
if(/^(UFA|RFA|E-RFA|OWNER|-)(\s|$)/i.test(l))return;cur={name:l.split(/\s+/)[0],c:null};out.push(cur)});
return out.map(d=>({name:d.name,contract:lg==='JBHL'?0:lg==='NAMHL'?CFG.CMIN:Math.min(CFG.CMAX,Math.max(CFG.CMIN,d.c||CFG.CMIN))}))}
const rosterOf=(t,lg)=>/\$\s*\d/.test(t)?parseWeb(t,lg):parseRoster(t,lg);
function putPlayers(list,lg,team){let a=0,u=0;list.forEach(d=>{const f={team,league:lg,contract:d.contract};if(d.pos)f.pos=d.pos;const ex=DB.players.find(p=>p.name.toLowerCase()===d.name.toLowerCase());if(ex){Object.assign(ex,f);u++}else{DB.players.push({name:d.name,mc:'',pos:'W',...f,gp:0,g:0,a:0,sog:0,hits:0,blk:0,pm:0,w:0,sv:0,ga:0});a++}});return `Added ${a}${u?', updated '+u:''} on ${team}.`}

const toiMin=t=>{const m=String(t).split(':');return m.length>1?(+m[0]||0)+(+m[1]||0)/60:parseFloat(t)||0};
function bulkStats(){const L=$('#bulk').value.split(/\r?\n/),num=x=>parseFloat(String(x).replace(/[,%]/g,''))||0;let n=0,seen=0;const miss=[];
for(let i=0;i<L.length;i++){const f=L[i].split('\t').map(x=>x.trim());if(f.length<40)continue;seen++;let v,c=[];
 if(/^[+-]?\d/.test(f[1]||'')){v=f.slice(1);let j=i-1;while(j>=0&&!L[j].trim())j--;let k=j-1;while(k>=0&&!L[k].trim())k--;if(k>=0)c.push(L[k].trim());if(j>=0)c.push(L[j].trim())}else{v=f.slice(2);c=[f[0]]}
 const p=c.map(nm=>DB.players.find(x=>x.name.toLowerCase()===nm.toLowerCase())).find(Boolean);if(!p){miss.push(c[0]);continue}
 Object.assign(p,{gp:num(v[0]),g:num(v[1]),a:num(v[2]),blk:num(v[4]),sog:num(v[5]),toi:+toiMin(v[11]).toFixed(2),gf:num(v[13]),gaa:num(v[14]),pm:num(v[15]),sf:num(v[18]),sa:num(v[19]),hits:num(v[v.length-1])});n++}
if(!seen)return bulkOld();
AD.msg='Updated stats for '+n+' players and recalculated overalls.'+(miss.length?' Not imported yet: '+miss.slice(0,8).join(', ')+(miss.length>8?' and '+(miss.length-8)+' more':'')+'.':'');saveDB()}
function bulkGoalies(){const L=$('#gbulk').value.split(/\r?\n/),num=x=>parseFloat(String(x).replace(/[,%]/g,''))||0;let n=0,seen=0,low=0;const miss=[];
for(let i=0;i<L.length;i++){const f=L[i].split('\t').map(x=>x.trim()),ti=f.findIndex(x=>/^\d+:\d{2}$/.test(x));if(ti<7)continue;seen++;
 const c=f.slice(0,Math.max(0,ti-8)).filter(x=>x&&!/^\d+$/.test(x));let j=i-1,k=0;while(j>=0&&k<2){const t=L[j].trim();if(t.includes('\t'))break;if(t&&!/^\d+$/.test(t)){c.push(t);k++}j--}
 const p=c.map(nm=>DB.players.find(x=>x.name.toLowerCase()===nm.toLowerCase())).find(Boolean);if(!p){miss.push(c[0]);continue}
 Object.assign(p,{pos:'G',gp:num(f[ti-7]),sa:num(f[ti-6]),sv:num(f[ti-5]),ga:num(f[ti-4]),gkgaa:num(f[ti-2]),so:num(f[ti-1]),toi:+toiMin(f[ti]).toFixed(2),blk:num(f[ti+1]),clr:num(f[ti+2]),glv:num(f[ti+3]),gx:num(f[ti+4])});n++;if(p.gp<4)low++}
if(!seen){AD.msg='No goalie rows found. Paste the rows exactly as copied, with tabs.';return render()}
AD.msg='Updated '+n+' goalies and recalculated overalls.'+(low?' '+low+' have under 4 games played, so their stats are not counted yet.':'')+(miss.length?' Not imported yet: '+miss.slice(0,8).join(', ')+(miss.length>8?' and '+(miss.length-8)+' more':'')+'.':'');saveDB()}

function bulkOld(){const L=$('#bulk').value.trim().split(/\r?\n/).filter(x=>x.trim());if(L.length<2){AD.msg='Paste the table with its header row.';return render()}
const sp=l=>l.includes('\t')?l.split('\t'):l.includes(',')?l.split(','):l.trim().split(/\s{2,}|\s+/);
const A={name:['name','player','username'],gp:['gp'],g:['g','goals'],a:['a','assists'],sog:['sog','shots','s'],hits:['hit','hits'],blk:['blk','blocks','bk'],pm:['+/-','pm','plusminus'],w:['w','wins'],sv:['sv','saves'],ga:['ga'],contract:['contract']};
const h=sp(L.shift()).map(x=>x.trim().toLowerCase()),ix={};for(const k in A){const i=h.findIndex(x=>A[k].includes(x));if(i>=0)ix[k]=i}
if(ix.name==null){AD.msg='The header row needs a Player or Name column.';return render()}
let n=0;const miss=[];L.forEach(l=>{const c=sp(l).map(x=>x.trim()),nm=(c[ix.name]||'').toLowerCase(),p=DB.players.find(x=>x.name.toLowerCase()===nm);if(!p){if(nm)miss.push(c[ix.name]);return}n++;for(const k in ix){if(k==='name')continue;if(k==='contract')p.contract=money(c[ix[k]]);else p[k]=parseFloat(c[ix[k]])||0}});
AD.msg='Updated stats for '+n+' players.'+(miss.length?' Not found: '+miss.slice(0,8).join(', ')+'.':'');saveDB()}

let CB=null;
function ask(msg,cb){CB=cb;$('#modal').innerHTML='<div class="box" style="max-width:360px;width:100%"><p>'+esc(msg)+'</p><div class="row"><button class="dg" onclick="const f=CB;CB=null;closeM();f&&f()">Yes, delete</button><button onclick="CB=null;closeM()">Cancel</button></div></div>';$('#modal').className='modal show'}
function clearDemo(){DB={players:[],teams:{},rank:{},grants:DB.grants||{},packs:DB.packs||{}};AD.msg='Cleared. Add your teams first.';saveDB()}
function discardLocal(){localStorage.removeItem('bh_db');location.reload()}
let DR=null;
function dstart(e){e.preventDefault();DR=e.currentTarget.closest('.dr').dataset.n;e.currentTarget.setPointerCapture(e.pointerId)}
function dmove(e){if(DR==null)return;const l=$('#drl'),r=(document.elementFromPoint(e.clientX,e.clientY)||{}).closest&&document.elementFromPoint(e.clientX,e.clientY).closest('.dr');if(!r||r.dataset.n===DR||r.parentNode!==l)return;const a=[...l.children].find(x=>x.dataset.n===DR),b=r.getBoundingClientRect();l.insertBefore(a,e.clientY<b.top+b.height/2?r:r.nextSibling)}
function dend(){if(DR==null)return;DR=null;DB.rank[AD.rl]=[...$('#drl').children].map(x=>x.dataset.n);saveDB()}
function addBB(){const n=($('#bbn').value||$('#bbt').value).trim(),a=parseInt($('#bba').value);if(!n||!(a>0)){AD.msg='Choose an account (or type a username) and enter a positive amount.';return render()}
DB.grants=DB.grants||{};const k=n.toLowerCase();DB.grants[k]=(DB.grants[k]||0)+a;AD.msg='Gave '+a.toLocaleString()+' BB to '+n+'.';saveDB()}
function vAdmin(){const tm=Object.keys(DB.teams).sort(),mg=DB.players.filter(p=>AD.mg==='All'||p.league===AD.mg).sort((a,b)=>a.team.localeCompare(b.team)||a.name.localeCompare(b.name));
return `<h2>Admin</h2>${SRC==='demo'?`<div class="box">Demo players are showing. <button onclick="ask('Remove all demo data?',clearDemo)">Start fresh</button></div>`:''}${AD.msg?`<div class="box">${esc(AD.msg)} <button onclick="AD.msg='';render()">OK</button></div>`:''}
<div class="box"><h3 style="margin-top:0">Blockey Bucks</h3><p class="mu">New accounts start with 0. Pick an account, enter an amount and add it. They receive it the next time they load the site, once you have published your data.json (step 6). The list shows accounts created in this browser, so type the username for anyone else.</p><div class="row"><select id="bbn"><option value="">Choose account…</option>${ACC.get().users.map(u=>`<option>${esc(u.mc)}</option>`).join('')}</select><input id="bbt" placeholder="or type a username"><input id="bba" type="number" min="1" placeholder="Amount" style="flex:0 1 120px"><button class="pri" onclick="addBB()">Add Blockey Bucks</button></div>${Object.keys(DB.grants||{}).length?'<p class="mu">Given so far: '+Object.entries(DB.grants).map(([k,v])=>esc(k)+' '+v.toLocaleString()).join(' · ')+'</p>':''}</div>
<div class="box"><h3 style="margin-top:0">1. Add a team</h3><div class="row"><input id="nt" placeholder="Team name"><select id="ntl">${LG.map(l=>`<option>${l}</option>`).join('')}</select><label class="box" id="nlbl" style="margin:0;padding:8px 13px;cursor:pointer;flex:0 0 auto">Choose logo<input id="ntf" type="file" accept="image/*" hidden onchange="this.parentNode.firstChild.textContent=this.files[0]?this.files[0].name:'Choose logo'"></label><button class="pri" onclick="addTeam()">Add team</button></div></div>
<div class="box"><h3 style="margin-top:0">2. Import players</h3><div class="row"><select onchange="AD.lg=this.value;AD.team='';render()"><option value="">Step 1: choose league</option>${LG.map(l=>`<option ${AD.lg===l?'selected':''}>${l}</option>`).join('')}</select><select id="aptm" ${AD.lg?'':'disabled'}><option value="">Step 2: choose team</option>${teamsIn(AD.lg).map(t=>`<option value="${esc(t)}" ${AD.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
<div class="row"><input id="apn" placeholder="Minecraft username"><select id="app" style="flex:0 1 90px"><option>C</option><option>W</option><option>D</option><option>G</option></select><input id="apc" style="flex:0 1 120px" ${AD.lg==='BHL'?'':'disabled'} placeholder="${AD.lg==='JBHL'?'No contract':AD.lg==='NAMHL'?'4.5K (fixed)':'4.5K to 45K'}"><button class="pri" onclick="addOne()">Add player</button></div>
<p class="mu">Or paste a whole roster for the team chosen above, exactly as it appears on the website: the username, then the contract line under it. Everything else is ignored. Every player starts as a winger; change positions in step 4.</p><textarea id="many" placeholder="Youppi&#10;$45,000 $45,000 OWNER&#10;#23&#10;Ghostyferret&#10;$37,500 UFA -&#10;#31"></textarea><div class="row"><button class="pri" onclick="addMany()">Import roster</button></div></div>
<div class="box"><h3 style="margin-top:0">3. Edit teams</h3><p class="mu">Change a name, league, color or logo. Renaming moves the team's players with it. Logo files can also go in <code>logos/team-name.png</code>.</p>${tm.map(t=>`<div class="rw" data-t="${esc(t)}" style="flex-wrap:wrap"><img class="tl" alt="" src="${esc(logo(t))}" data-t="${esc(t)}" onerror="lerr(this)"><input style="flex:1 1 150px" value="${esc(t)}" onchange="renTeam(this)"><select style="width:92px" onchange="teamLg(this)">${LG.map(l=>`<option ${DB.teams[t].league===l?'selected':''}>${l}</option>`).join('')}</select><input type="color" style="width:44px;padding:2px" value="${/^#[0-9a-f]{6}$/i.test(tcol(t))?tcol(t):'#475569'}" onchange="setCol(this)"><label class="box" style="margin:0;padding:7px 11px;cursor:pointer">Logo<input type="file" accept="image/*" hidden onchange="upLogo(this)"></label><button class="dg" onclick="delTeam(this)">✕</button></div>`).join('')||'<p class="mu">No teams yet.</p>'}</div>
<div class="box"><h3 style="margin-top:0">4. Manage players</h3><div class="chips">${['All',...LG].map(l=>`<button class="${AD.mg===l?'on':''}" onclick="AD.mg='${l}';render()">${l}</button>`).join('')}</div>${mg.slice(0,100).map(p=>`<div class="rw" data-n="${esc(p.name)}" style="flex-wrap:wrap">${head(p)}<div class="l" style="flex:1 1 110px"><b>${esc(p.name)}</b></div><select style="width:70px" onchange="editP(this,'pos')">${['C','W','D','G'].map(x=>`<option ${p.pos===x?'selected':''}>${x}</option>`).join('')}</select><select style="width:150px" onchange="editP(this,'team')">${tm.map(t=>`<option value="${esc(t)}" ${p.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select style="width:100px" title="Overall" onchange="editP(this,'ovr')"><option value="">Auto (${(BN[p.name]||{}).auto||''})</option>${[...Array(60)].map((_,i)=>99-i).map(n=>`<option ${p.ovr===n?'selected':''}>${n}</option>`).join('')}</select>${p.league!=='JBHL'?`<input style="width:80px" title="Contract" value="${p.contract?fC(p.contract).slice(1):''}" onchange="editP(this,'contract')">`:''}<input style="width:120px" title="Skin name, only if different from the username" placeholder="Skin name" value="${esc(p.mc||'')}" onchange="editP(this,'mc')"><button class="dg" onclick="delP(this)">✕</button></div>`).join('')||'<p class="mu">No players.</p>'}${mg.length>100?`<p class="mu">Showing 100 of ${mg.length}.</p>`:''}</div>
<div class="box"><h3 style="margin-top:0">5. Stats</h3><p class="mu">Copy the whole stats table from the main page (headers included) and paste it here. Each player you have already imported is matched by username and updated. BHL overalls are mostly set by contract (4.5K lowest to 45K best), then stats separate players on similar contracts, with goals weighted a little heavier. Players on 4.5K (BHL minimum and all of NAMHL) are ranked against each other mainly by goals and assists, with goals counting a bit more; other stats only break ties. A player with clearly outstanding stats far above their contract gets a breakout boost. NAMHL and JBHL overalls use stats only. Players who are not imported yet are skipped.</p><textarea id="bulk" placeholder="name,g,a,sog,gp&#10;Steve12,4,6,20,10"></textarea><div class="row"><button onclick="bulkStats()">Import stats</button></div></div>
<div class="box"><h3 style="margin-top:0">Pack art</h3><p class="mu">Upload the picture used for each league's pack, both in the Packs tab and in the opening animation. Use a tall PNG (about 2:3) with a transparent background. The pack tears open along a line about 14% down from the top, so keep the crimped top edge above that. Without an upload, the site uses <code>bhlpack.png</code>, <code>namhlpack.png</code> or <code>jbhlpack.png</code> from your repo if they exist, then a plain colored pack.</p><div class="packs">${LG.map(k=>`<div class="box pt">${packImg(k)?`<img class="mini2" src="${packImg(k)}" alt="${k}">`:`<div class="mini" style="--pa:${CFG.PK[k].c[0]};--pb:${CFG.PK[k].c[1]}">${k}</div>`}<b>${k} pack</b><span class="mu">${(DB.packs||{})[k]?'Custom upload':PKIMG[k]?'Default file':'No art'}</span><div class="row" style="justify-content:center"><label class="box" style="margin:0;padding:7px 11px;cursor:pointer;flex:0 0 auto">Upload<input type="file" accept="image/*" hidden onchange="upPack(this,'${k}')"></label>${(DB.packs||{})[k]?`<button class="dg" onclick="resetPack('${k}')">Reset</button>`:''}</div></div>`).join('')}</div></div>
<div class="box"><h3 style="margin-top:0">5b. Goalie stats</h3><p class="mu">Paste the goalie table rows (the rank and name lines, then the tab-separated line starting with the team). Goalies are matched by username and set to position G. A goalie needs 4+ games played before stats count. Overall is 75% contract and 25% stats, like skaters. Goalie contracts are scaled from 7.5K (lowest) to 18K (highest) instead of 4.5K to 45K (save %, GAA, shutouts, shots faced, blocks, clears, glove). NAMHL and JBHL goalies use stats only.</p><textarea id="gbulk" placeholder="1&#10;packrs&#10;packrs&#10;CGY&#9;6&#9;54&#9;48&#9;6&#9;0.889&#9;1.00&#9;3&#9;106:11&#9;2&#9;38&#9;58&#9;44"></textarea><div class="row"><button onclick="bulkGoalies()">Import goalie stats</button></div></div>
<div class="box"><h3 style="margin-top:0">6. Publish for everyone</h3><p class="mu">Edits save in your browser only. Export <code>data.json</code> and upload it (plus any logos) to your GitHub repo next to index.html.</p><div class="row"><button class="pri" onclick="expJSON()">Export data.json</button><label class="box" style="margin:0;padding:8px 13px;cursor:pointer;flex:0 0 auto">Load data.json<input type="file" accept=".json" hidden onchange="impJSON(this)"></label>${SRC==='local'?'<button class="dg" onclick="ask(\'Throw away your local edits?\',discardLocal)">Discard local edits</button>':''}</div></div>`}
/* render */
const LST={Fantasy:fanList,Players:plList};
const TABS={Fantasy:vFantasy,Budget:vBudget,Packs:vPacks,Rankings:vRank,Players:vPlayers,Teams:vTeams};
function render(){setUser();if(USER){if(!S||SK!=='bh_state_'+USER.mc.toLowerCase())loadS();applyG()}if(ADMIN)TABS.Admin=vAdmin;else delete TABS.Admin;if(!TABS[tab])tab='Fantasy';
$('#logo').innerHTML='<span class="lmark">BG</span><span class="lword"><b>Blockey</b><i>Games</i></span>';$('#th').innerHTML=Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${document.documentElement.dataset.theme===k?'selected':''}>${v}</option>`).join('');
if(!USER){$('#bb').style.display='none';$('#tabs').innerHTML='';$('#view').innerHTML=vAuth();return}
$('#bb').style.display='';$('#bb').innerHTML='<i class="coin"></i>'+S.bb.toLocaleString()+' <small style="opacity:.6">BB</small>';
$('#tabs').innerHTML=Object.keys(TABS).map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render();scrollTo(0,0)">${t==='Budget'?'Dream Lineup':t}</button>`).join('')+`<button onclick="logout()">Log out (${esc(USER.mc)})</button>`;
$('#view').innerHTML=(SRC==='demo'&&tab!=='Admin'?'<div class="box">Demo players. The real rosters have not been added yet.</div>':'')+TABS[tab]();scanSkins()}
try{new MutationObserver(()=>scanSkins()).observe(document.body,{childList:true,subtree:true})}catch(e){}
(async()=>{let t='midnight';try{t=localStorage.getItem('bh_theme')||t}catch(e){}setTheme(t);await loadDB();prep();render();Object.entries(CFG.PK).forEach(([k,v])=>{if(v.img){const i=new Image;i.onload=()=>{PKIMG[k]=v.img;if(!anim)render()};i.src=v.img}})})();
</script></body></html>
